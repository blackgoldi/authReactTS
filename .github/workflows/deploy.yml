name: Выгрузка сайта на GitHub Pages

on: 
  #Когда происходит push в указанную ниже ветку, то запускается данный Workflow
  push: 
    branches: ['main'] 

  workflow_dispatch: #Позволяет в ручную запустить данный workflow

#Устанавливаем разрешения для GITHUB_token  
permissions: 
  contents: read
  pages: write
  id-token: write

#Настраиваем запуск только одного процесса
concurrency: 
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages 
    runs-on: self-hosted
    steps:
      - name: Проверка
        uses: actions/checkout@v6
      - name: Установка Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Сборка
        run: npm run build
      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
        # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
